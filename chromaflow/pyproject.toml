[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chromaflow"
version = "1.0.0"
description = "A music visualizer in the tradition of SoundSpectrum's G-Force, WhiteCap and Aeon"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
chromaflow = "chromaflow.cli:main"

[tool.setuptools]
packages = ["chromaflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
