# Long expressions can be continued with a trailing backslash.

name     = Breathing grid
palette  = Vapor

flow.dx  = sin(y*4.0 + t*0.6)*0.35 \
           + noise(x*1.2, y*1.2 + t*0.1)*0.5*(0.3 + mag)
flow.dy  = sin(x*4.0 - t*0.5)*0.35 \
           + noise(y*1.2, x*1.2 - t*0.1)*0.5*(0.3 + mag)

wave.x   = (s*2.0 - 1.0) * 1.05
wave.y   = tri(s*8.0 + t*0.2)*0.30 + w*0.75
wave.ink = 0.4 + spec(s)*1.5

decay    = 0.960
spin     = 0.0
mirror   = 4
lw       = 2.6
