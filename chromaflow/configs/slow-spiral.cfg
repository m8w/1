# A plain-text config, in the spirit of a G-Force WaveShape + FlowField pair.
# Everything is an expression in x y r th s w t mag bass mid treb level beat.

name     = Slow spiral
palette   = Aurora

# FlowField: the velocity the picture is dragged along, per second.
flow.dx  = -y*(0.75 + bass*0.9) - x*0.18
flow.dy  =  x*(0.75 + bass*0.9) - y*0.18

# WaveShape: a parametric curve in s, with w the audio sample at that step.
wave.x   = cos(s*tau*2 + t*0.25) * (0.18 + s*0.62) * (1.0 + w*0.8)
wave.y   = sin(s*tau*2 + t*0.25) * (0.18 + s*0.62) * (1.0 + w*0.8)
wave.ink = 0.35 + treb*1.4

decay    = 0.970
spin     = 0.05
zoom     = -0.02
lw       = 2.2
steps    = 2048
bloom    = 1.0
